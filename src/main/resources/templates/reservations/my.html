<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Reservations - DineDelight</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background:#F8F5F0; color:#3C3C3C; min-height:100vh; display:flex; justify-content:center; align-items:center; }
    .wrap { width:92%; max-width:1000px; background:#fff; border-radius:16px; box-shadow:0 15px 30px rgba(0,0,0,.1); overflow:hidden; }
    .header { background:#D4A76A; color:#fff; padding:20px 28px; display:flex; align-items:center; justify-content:space-between; }
    .header h1 { font-size:1.4rem; }
    .header a { color:#fff; text-decoration:none; font-weight:600; }
    .content { padding:26px; }
    .alert { padding:10px 12px; border-radius:6px; margin:10px 0; font-size:.9rem; }
    .alert-ok { background:#E6F4EA; color:#2E7D32; border-left:4px solid #2E7D32; }
    .alert-err { background:#FFE6E6; color:#AF2C2C; border-left:4px solid #AF2C2C; }
    table { width:100%; border-collapse:separate; border-spacing:0; }
    th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #eee; }
    th { color:#AF2C2C; font-size:.95rem; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; border:1px solid #AF2C2C; background:#AF2C2C; color:#fff; cursor:pointer; font-weight:600; }
    .btn:hover { background:#942525; border-color:#942525; }
    .ghost { background:#fff; color:#3C3C3C; border:1px solid #D4A76A; }
    .ghost:hover { background:#FFF7EC; }
    .actions { display:flex; gap:10px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1><i class="fas fa-list"></i> My Reservations</h1>
    <a href="/dashboard"><i class="fas fa-gauge"></i> Dashboard</a>
  </div>
  <div class="content">
    <div class="alert alert-ok" th:if="${param.cancelled}">Reservation cancelled.</div>
    <div class="alert alert-err" th:if="${param.error}">Could not cancel reservation.</div>

    <table>
      <thead>
      <tr>
        <th>Table</th>
        <th>Guests</th>
        <th>Start</th>
        <th>End</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="r : ${reservations}">
        <td th:text="${r.diningTable.tableCode}"></td>
        <td th:text="${r.guestCount}"></td>
        <td th:text="${#temporals.format(r.startTime, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(r.endTime, 'yyyy-MM-dd HH:mm')}"></td>
        <td class="actions">
          <form th:action="@{/reservations/cancel}" method="post">
            <input type="hidden" name="id" th:value="${r.id}">
            <button class="btn" type="submit"><i class="fas fa-xmark"></i> Cancel</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>

    <div style="margin-top:14px; display:flex; gap:10px;">
      <a class="btn ghost" href="/reservations"><i class="fas fa-chair"></i> Back to search</a>
      <a class="btn ghost" href="/dashboard"><i class="fas fa-gauge"></i> Dashboard</a>
    </div>
  </div>
</div>
</body>
</html>
