<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find a Table - DineDelight</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color:#F8F5F0; color:#3C3C3C; min-height:100vh; display:flex; justify-content:center; align-items:center;
      background-image: linear-gradient(rgba(255,255,255,.9), rgba(255,255,255,.9)),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="none" stroke="%23D4A76A" stroke-width="0.5" x="0" y="0" width="100" height="100"/></svg>');
      background-size:30px 30px;
    }
    .wrap { width:92%; max-width:1000px; background:#fff; border-radius:16px; box-shadow:0 15px 30px rgba(0,0,0,.1); overflow:hidden; }
    .header { background:#D4A76A; color:#fff; padding:20px 28px; display:flex; align-items:center; justify-content:space-between; }
    .header h1 { font-size:1.4rem; }
    .header a { color:#fff; text-decoration:none; font-weight:600; }
    .content { padding:26px; display:grid; grid-template-columns: 1.2fr 1fr; gap:20px; }
    .card { border:1px solid #eee; border-radius:12px; padding:18px; }
    .card h2 { color:#AF2C2C; font-size:1.3rem; margin-bottom:12px; }
    .form-row { display:grid; grid-template-columns: repeat(2, minmax(140px,1fr)); gap:12px; }
    label { font-weight:600; font-size:.9rem; display:block; margin-bottom:6px; }
    input, select { width:100%; padding:12px 12px; border:1px solid #ddd; border-radius:8px; font-size:.95rem; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:12px 16px; border-radius:8px; border:1px solid #AF2C2C; background:#AF2C2C; color:#fff; text-decoration:none; cursor:pointer; font-weight:600; }
    .btn:hover { background:#942525; border-color:#942525; }
    .muted { font-size:.9rem; color:#666; margin-top:10px; }
    .alert { padding:10px 12px; border-radius:6px; margin:10px 0; font-size:.9rem; }
    .alert-error { background:#FFE6E6; color:#AF2C2C; border-left:4px solid #AF2C2C; }
    .alert-success { background:#E6F4EA; color:#2E7D32; border-left:4px solid #2E7D32; }
    .list { display:flex; flex-direction:column; gap:10px; }
    .item { border:1px solid #eee; border-radius:10px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; }
    .item .meta { display:flex; gap:12px; align-items:center; }
    .badge { background:#F8F5F0; color:#3C3C3C; border:1px solid #E7D9C2; padding:6px 10px; border-radius:999px; font-weight:600; font-size:.85rem; }
    .ghost { background:#fff; color:#3C3C3C; border:1px solid #D4A76A; }
    .ghost:hover { background:#FFF7EC; }
    @media (max-width: 860px) { .content { grid-template-columns: 1fr; } .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1><i class="fas fa-chair"></i> Find a Table</h1>
      <a href="/dashboard"><i class="fas fa-gauge"></i> Dashboard</a>
    </div>
    <div class="content">
      <div class="card">
        <h2>Search</h2>
        <form th:action="@{/reservations/search}" method="get">
          <div class="form-row">
            <div>
              <label>Date</label>
              <input type="date" name="date" required th:value="${date}">
            </div>
            <div>
              <label>Time</label>
              <input type="time" name="time" required th:value="${time}">
            </div>
            <div>
              <label>Duration (minutes)</label>
              <input type="number" name="durationMinutes" value="90" min="30" step="15" th:value="${durationMinutes}">
            </div>
            <div>
              <label>Guests</label>
              <input type="number" name="guests" value="2" min="1" th:value="${guests}">
            </div>
          </div>
          <div style="margin-top:14px">
            <button class="btn" type="submit"><i class="fas fa-search"></i> Search</button>
          </div>
          <div class="alert alert-error" th:if="${param.conflict}">Selected slot just got booked. Try another.</div>
          <div class="alert alert-success" th:if="${param.success}">Reservation created!</div>
          <div class="alert alert-error" th:if="${param.error}">Action failed.</div>
          <div class="alert" th:if="${param.cancelled}" style="background:#FFF7EC; border-left:4px solid #D4A76A;">Reservation cancelled.</div>
        </form>
        <div class="muted">Tip: peak hours fill fast. Try flexible times.</div>
      </div>

      <div class="card">
        <h2>Available Tables</h2>
        <div th:if="${availableTables == null}">Search to see availability.</div>
        <div th:if="${availableTables != null}">
          <div class="list" th:if="${#lists.size(availableTables) > 0}">
            <div class="item" th:each="t : ${availableTables}">
              <div class="meta">
                <span class="badge"><i class="fas fa-utensils"></i> <span th:text="${t.tableCode}"></span></span>
                <span class="badge"><i class="fas fa-user-friends"></i> cap <span th:text="${t.capacity}"></span></span>
              </div>
              <form th:action="@{/reservations/book}" method="post">
                <input type="hidden" name="tableId" th:value="${t.id}">
                <input type="hidden" name="date" th:value="${date}">
                <input type="hidden" name="time" th:value="${time}">
                <input type="hidden" name="durationMinutes" th:value="${durationMinutes}">
                <input type="hidden" name="guests" th:value="${guests}">
                <button class="btn ghost" type="submit"><i class="fas fa-check"></i> Book</button>
              </form>
            </div>
          </div>
          <div th:if="${#lists.size(availableTables) == 0}">No tables available for this slot.</div>
        </div>
        <div style="margin-top:14px">
          <a class="btn ghost" href="/reservations/my"><i class="fas fa-list"></i> My reservations</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
