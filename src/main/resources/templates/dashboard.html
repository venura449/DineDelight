<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - DineDelight</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: #F8F5F0; color: #3C3C3C; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      background-image: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)),
        url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect fill="none" stroke="%23D4A76A" stroke-width="0.5" x="0" y="0" width="100" height="100"/></svg>');
      background-size: 30px 30px;
    }
    .card {
      width: 92%; max-width: 900px; background: #fff; border-radius: 16px; box-shadow: 0 15px 30px rgba(0,0,0,0.1);
      overflow: hidden; display: grid; grid-template-columns: 1fr 1.2fr;
    }
    .left {
      background: #D4A76A; color: #fff; padding: 40px; display: flex; flex-direction: column; justify-content: center; position: relative;
    }
    .left::before { content: ""; position: absolute; inset: 0;
      background: radial-gradient(circle at 20% 80%, rgba(166,123,64,0.5) 0%, transparent 25%),
                  radial-gradient(circle at 80% 20%, rgba(166,123,64,0.5) 0%, transparent 25%);
    }
    .brand { position: relative; z-index: 1; }
    .brand h1 { font-size: 2.3rem; letter-spacing: 1px; }
    .brand span { display: block; font-size: .95rem; letter-spacing: 4px; font-weight: 300; opacity: .95; }
    .icons { margin: 28px 0; position: relative; z-index: 1; }
    .icons i { font-size: 2.2rem; margin-right: 12px; opacity: .95; }
    .left p { position: relative; z-index: 1; max-width: 320px; line-height: 1.6; font-weight: 300; }
    .right { padding: 40px; display: flex; flex-direction: column; justify-content: center; }
    .title { color: #AF2C2C; font-size: 2rem; margin-bottom: 18px; font-weight: 600; text-align: left; }
    .actions { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 16px; margin-top: 10px; }
    .btn { display: inline-flex; align-items: center; gap: 10px; padding: 14px 16px; border-radius: 8px; border: 1px solid #ddd; text-decoration: none; color: #3C3C3C; background: #fff; transition: all .25s; font-weight: 600; }
    .btn i { color: #D4A76A; }
    .btn:hover { border-color: #D4A76A; box-shadow: 0 4px 16px rgba(212,167,106,0.25); transform: translateY(-1px); }
    .btn-primary { background: #AF2C2C; color: #fff; border-color: #AF2C2C; }
    .btn-primary i { color: #fff; }
    .btn-primary:hover { background: #942525; border-color: #942525; box-shadow: 0 6px 18px rgba(175,44,44,0.25); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; }
    @media (max-width: 860px) { .card { grid-template-columns: 1fr; } .left { order: 2; } .right { order: 1; } }
  </style>
  
</head>
<body>
<div class="card">
  <div class="left">
    <div class="brand">
      <h1>DineDelight</h1>
      <span>RESTAURANT & EVENTS</span>
    </div>
    <div class="icons">
      <i class="fas fa-utensils"></i>
      <i class="fas fa-glass-cheers"></i>
      <i class="fas fa-calendar-alt"></i>
    </div>
    <p>Welcome to your dashboard. Manage reservations and view your bookings with a refined experience.</p>
  </div>
  <div class="right">
    <div class="title">Dashboard</div>
    <div class="actions">
      <a class="btn btn-primary" href="/reservations"><i class="fas fa-chair"></i> Customer Table Reservation</a>
      <a class="btn" href="/reservations/my"><i class="fas fa-list"></i> My Reservations</a>
      <a class="btn" href="/events"><i class="fas fa-calendar-plus"></i> Event Booking</a>
      <a class="btn" href="/events/my"><i class="fas fa-calendar-check"></i> My Event Requests</a>
      <a class="btn" href="/"><i class="fas fa-home"></i> Home</a>
      <a class="btn" href="/logout"><i class="fas fa-right-from-bracket"></i> Logout</a>
    </div>
  </div>
</div>

</body>
</html>
