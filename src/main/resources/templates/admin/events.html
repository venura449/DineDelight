<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pending Event Requests - Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background:#F8F5F0; color:#3C3C3C; min-height:100vh; display:flex; justify-content:center; align-items:center; }
    .wrap { width:92%; max-width:1000px; background:#fff; border-radius:16px; box-shadow:0 15px 30px rgba(0,0,0,.1); overflow:hidden; }
    .header { background:#AF2C2C; color:#fff; padding:20px 28px; display:flex; align-items:center; justify-content:space-between; }
    .header h1 { font-size:1.4rem; }
    .header a { color:#fff; text-decoration:none; font-weight:600; }
    .content { padding:26px; }
    table { width:100%; border-collapse:separate; border-spacing:0; }
    th, td { text-align:left; padding:12px 14px; border-bottom:1px solid #eee; }
    th { color:#AF2C2C; font-size:.95rem; }
    .btn { display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; border:1px solid #AF2C2C; background:#AF2C2C; color:#fff; cursor:pointer; font-weight:600; }
    .btn:hover { background:#942525; border-color:#942525; }
    .ghost { background:#fff; color:#3C3C3C; border:1px solid #D4A76A; }
    .ghost:hover { background:#FFF7EC; }
    .actions { display:flex; gap:8px; }
    .notice { margin-bottom:10px; padding:10px 12px; border-radius:6px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1><i class="fas fa-clipboard-check"></i> Pending Event Requests</h1>
    <div>
      <a href="/admin/dashboard" style="margin-right:8px"><i class="fas fa-gauge"></i> Admin Dashboard</a>
      <a href="/logout"><i class="fas fa-right-from-bracket"></i> Logout</a>
    </div>
  </div>
  <div class="content">
    <div class="notice" th:if="${param.approved}" style="background:#E6F4EA; color:#2E7D32;">Request approved.</div>
    <div class="notice" th:if="${param.rejected}" style="background:#FFE6E6; color:#AF2C2C;">Request rejected.</div>
    <div class="notice" th:if="${param.conflict}" style="background:#FFF7EC;">Conflict with another approved booking.</div>
    <table>
      <thead>
      <tr>
        <th>Space</th>
        <th>Guests</th>
        <th>Start</th>
        <th>End</th>
        <th>Services</th>
        <th>Action</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="b : ${bookings}">
        <td th:text="${b.eventSpace.name}"></td>
        <td th:text="${b.guestCount}"></td>
        <td th:text="${#temporals.format(b.startTime, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(b.endTime, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${b.services}"></td>
        <td class="actions">
          <form th:action="@{/admin/events/approve}" method="post">
            <input type="hidden" name="id" th:value="${b.id}">
            <button class="btn" type="submit"><i class="fas fa-check"></i> Approve</button>
          </form>
          <form th:action="@{/admin/events/reject}" method="post">
            <input type="hidden" name="id" th:value="${b.id}">
            <button class="btn ghost" type="submit"><i class="fas fa-times"></i> Reject</button>
          </form>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
